name: Set up Nix
description: Install Nix and configure the binary cache from the service contract
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@v22
      with:
        extra-conf: |
          fallback = true
          eval-cache = true

    - name: Configure the declared binary cache
      shell: bash
      run: |
        cache=$(nix eval --json .#binaryCache)
        endpoint=$(jq -er '.endpoint' <<< "$cache")
        name=$(jq -er '.cache' <<< "$cache")
        substituter=$(jq -er '.substituter' <<< "$cache")
        keys=$(jq -er '.keys | join(" ")' <<< "$cache")
        # A valid cache must answer before any expensive build starts.
        info=$(curl --fail --silent --show-error --retry 2 --max-time 30 "$substituter/nix-cache-info")
        grep -qx 'StoreDir: /nix/store' <<< "$info"
        {
          echo "ATTIC_ENDPOINT=$endpoint"
          echo "ATTIC_CACHE=$name"
          echo 'NIX_CONFIG<<NIX_CONFIG_EOF'
          echo "${NIX_CONFIG:-}"
          echo "extra-substituters = $substituter"
          echo "extra-trusted-public-keys = $keys"
          echo 'NIX_CONFIG_EOF'
        } >> "$GITHUB_ENV"
