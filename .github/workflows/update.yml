name: Flake Update

# A run that finds main moving underneath it re-dispatches itself on current
# main. The replacement starts a fresh prepare and all host builds, and carries
# the retry count in this input, because a new run starts again at attempt 1.
run-name: Flake Update${{ github.event_name == 'workflow_dispatch' && github.event.inputs.retry != '0' && format(' (retry {0})', github.event.inputs.retry) || '' }}

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      retry:
        description: Retry counter set by a re-dispatched run; do not set it by hand.
        required: false
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      has-updates: ${{ steps.detect.outputs.has-updates }}
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      - id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix flake update
          nix run .#update-custom-packages
          # The updater writes its results into the working tree. Stage whatever
          # it changed instead of listing manifest paths here a second time: the
          # inventory belongs to the updater's discovery, not to this workflow.
          git add -A
          if git diff --cached --quiet; then
            echo "has-updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-updates=true" >> "$GITHUB_OUTPUT"
            git diff --cached --binary > "$RUNNER_TEMP/update.patch"
          fi

      # The host matrix is the flake's own host list; a literal here is a second inventory that
      # drifts (it last named yorke, jello, strummer, mackaye and rollins - none of which exist).
      - id: hosts
        name: Derive the host matrix from the flake
        run: |
          hosts=$(nix eval --json '.#nixosConfigurations' --apply 'builtins.attrNames')
          echo "matrix={\"host\":$hosts}" >> "$GITHUB_OUTPUT"

      - name: Upload the update patch
        if: steps.detect.outputs.has-updates == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: update-patch
          path: ${{ runner.temp }}/update.patch
          retention-days: 1

      # The gate is `--max-jobs 1`: parallel builders on a 16 GB runner exhaust memory, and a builder
      # killed by the kernel is reported as a failed check - indistinguishable from a real one.
      - name: Check updated flake
        run: nix flake check --print-build-logs --max-jobs 1

  build:
    needs: prepare
    if: needs.prepare.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the update patch
        uses: actions/download-artifact@v7
        with:
          name: update-patch

      - name: Apply the update patch to the flake source
        run: git apply --index update.patch

      - uses: ./.github/actions/build-nixos-host
        with:
          host: ${{ matrix.host }}
          # Low priority, conserves runner resources
          max-jobs: "1"
          attic-push-token: ${{ secrets.ATTIC_PUSH_TOKEN }}

  build-status:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.prepare.result }}" != "success" ]; then
            echo "Update preparation failed" >&2
            exit 1
          fi
          if [ "${{ needs.prepare.outputs.has-updates }}" = "false" ]; then
            echo "ℹ️ No updates detected, nothing to build."
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ One or more builds failed"
            exit 1
          fi
          echo "✅ All systems built successfully"

  commit:
    needs: [prepare, build-status]
    if: needs.prepare.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `actions: write` is required to re-dispatch the workflow on current main
    # when the branch moved during validation.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the update patch
        uses: actions/download-artifact@v7
        with:
          name: update-patch

      # Purposely no force push and no rebase: a stale, validated tree is never
      # written onto main. The script re-dispatches a full run on current main
      # instead, and only treats a moved branch as a race.
      - name: Commit and push the validated update
        env:
          BASE_SHA: ${{ github.sha }}
          RETRY: ${{ github.event.inputs.retry || '0' }}
          MAX_RETRIES: "3"
          PATCH: update.patch
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./.github/scripts/push-flake-update.sh
