name: Flake Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-updates: ${{ steps.detect.outputs.has-updates }}
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix flake update
          nix run .#update-custom-packages || true
          if git diff --quiet -- flake.lock packages/custom features/dev/pi; then
            echo "has-updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-updates=true" >> "$GITHUB_OUTPUT"
          fi

      # The host matrix is the flake's own host list; a literal here is a second inventory that
      # drifts (it last named yorke, jello, strummer, mackaye and rollins - none of which exist).
      - id: hosts
        name: Derive the host matrix from the flake
        run: |
          hosts=$(nix eval --json '.#nixosConfigurations' --apply 'builtins.attrNames')
          echo "matrix={\"host\":$hosts}" >> "$GITHUB_OUTPUT"

      - name: Upload updated flake.lock and manifests
        if: steps.detect.outputs.has-updates == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updated-flake-lock
          path: |
            flake.lock
            packages/custom/**/manifest.json
            features/dev/pi/**/manifest.json
            features/dev/pi/**/package-lock.json
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download updated flake.lock
        uses: actions/download-artifact@v7
        with:
          name: updated-flake-lock

      - uses: ./.github/actions/build-nixos-host
        with:
          host: ${{ matrix.host }}
          # Low priority, conserves runner resources
          max-jobs: "1"
          attic-push-token: ${{ secrets.ATTIC_PUSH_TOKEN }}

  build-status:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.prepare.outputs.has-updates }}" != "true" ]; then
            echo "ℹ️ No updates detected, nothing to build."
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ One or more builds failed"
            exit 1
          fi
          echo "✅ All systems built successfully"

  commit:
    needs: build-status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download updated flake.lock
        uses: actions/download-artifact@v7
        with:
          name: updated-flake-lock

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock packages/custom features/dev/pi
          git commit -m "chore(deps): update flake inputs and custom packages"
          git push origin main
