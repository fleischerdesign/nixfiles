name: CI

on:
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, "hosts/**", "roles/**", "features/**", "packages/**", "lib/**", "user/**", "media/**"]
  pull_request:
    paths: [flake.nix, flake.lock, "hosts/**", "roles/**", "features/**", "packages/**", "lib/**", "user/**", "media/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Check flake
        run: nix flake check --print-build-logs

  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      # The host matrix is the flake's own host list; a literal here is a second inventory that
      # drifts (it last named yorke, jello, strummer, mackaye and rollins - none of which exist).
      - id: list
        name: Derive the host matrix from the flake
        run: |
          hosts=$(nix eval --json '.#nixosConfigurations' --apply 'builtins.attrNames')
          echo "matrix={\"host\":$hosts}" >> "$GITHUB_OUTPUT"

  build:
    needs: [flake-check, hosts]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-nixos-host
        with:
          host: ${{ matrix.host }}
          max-jobs: "2"
          attic-push-token: ${{ secrets.ATTIC_PUSH_TOKEN }}

  build-status:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ One or more builds failed"
            exit 1
          fi
          echo "✅ All systems built successfully"
