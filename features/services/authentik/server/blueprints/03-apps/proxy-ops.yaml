version: 1
metadata:
  name: "vyrx-apps-proxy-ops"
entries:
  # 1. SearXNG
  - model: authentik_providers_proxy.proxyprovider
    id: provider_proxy_searxng
    identifiers:
      name: "Provider for SearXNG"
    attrs:
      mode: "forward_single"
      external_host: "https://search.ops.vyrx.de"
      authorization_flow: "!Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]"

  - model: authentik_core.application
    identifiers:
      slug: "searxng"
    attrs:
      name: "SearXNG Search"
      provider: "!Key provider_proxy_searxng"
      meta_launch_url: "https://search.ops.vyrx.de"
      group: "Observability & Tools"
      open_in_new_tab: true

  # 2. OpenClaw Central Redirect
