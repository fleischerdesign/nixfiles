  - model: authentik_core.application
    identifiers:
      slug: "openclaw-ai"
    attrs:
      name: "OpenClaw AI Gateway"
      provider: "!Key provider_proxy_openclaw_root"
      meta_launch_url: "https://ai.ops.vyrx.de"
      group: "AI & Agents"
      open_in_new_tab: true

