version: 1
metadata:
  name: "vyrx-apps-proxy-infra"
entries:
  # 1. ESPHome
  - model: authentik_providers_proxy.proxyprovider
    id: provider_proxy_esphome
    identifiers:
      name: "Provider for ESPHome"
    attrs:
      mode: "forward_single"
      external_host: "https://esphome.srv.lan.vyrx.de"
      authorization_flow: "!Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]"

  - model: authentik_core.application
    identifiers:
      slug: "esphome"
    attrs:
      name: "ESPHome"
      provider: "!Key provider_proxy_esphome"
      meta_launch_url: "https://esphome.srv.lan.vyrx.de"
      group: "Infrastructure"
      open_in_new_tab: true

  # 2. Mainsail (Klipper Web UI)
  - model: authentik_providers_proxy.proxyprovider
    id: provider_proxy_mainsail
    identifiers:
      name: "Provider for Mainsail"
    attrs:
      mode: "forward_single"
      external_host: "https://mainsail.srv.lan.vyrx.de"
      authorization_flow: "!Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]"

  - model: authentik_core.application
    identifiers:
      slug: "mainsail"
    attrs:
      name: "Mainsail"
      provider: "!Key provider_proxy_mainsail"
      meta_launch_url: "https://mainsail.srv.lan.vyrx.de"
      group: "3D Printing"
      open_in_new_tab: true

  # 3. Moonraker (Klipper API)
  - model: authentik_providers_proxy.proxyprovider
    id: provider_proxy_moonraker
    identifiers:
      name: "Provider for Moonraker"
    attrs:
      mode: "forward_single"
      external_host: "https://moonraker.srv.lan.vyrx.de"
      authorization_flow: "!Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]"

  - model: authentik_core.application
    identifiers:
      slug: "moonraker"
    attrs:
      name: "Moonraker"
      provider: "!Key provider_proxy_moonraker"
      meta_launch_url: "https://moonraker.srv.lan.vyrx.de"
      group: "3D Printing"
      open_in_new_tab: true

  # 4. Klipper Webcam Stream
  - model: authentik_providers_proxy.proxyprovider
    id: provider_proxy_mainsail_cam
    identifiers:
      name: "Provider for Klipper Cam"
    attrs:
      mode: "forward_single"
      external_host: "https://cam.moonraker.srv.lan.vyrx.de"
      authorization_flow: "!Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]"

  - model: authentik_core.application
    identifiers:
      slug: "klipper-cam"
    attrs:
      name: "Klipper Webcam"
      provider: "!Key provider_proxy_mainsail_cam"
      meta_launch_url: "https://cam.moonraker.srv.lan.vyrx.de"
      group: "3D Printing"
      open_in_new_tab: true
