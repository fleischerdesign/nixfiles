version: 1
metadata:
  name: "vyrx-apps-proxy-media"
entries:
  # 1. Sonarr
  - model: authentik_providers_proxy.proxyprovider
    id: provider_proxy_sonarr
    identifiers:
      name: "Provider for Sonarr"
    attrs:
      mode: "forward_single"
      external_host: "https://sonarr.srv.lan.vyrx.de"
      authorization_flow: "!Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]"

  - model: authentik_core.application
    identifiers:
      slug: "sonarr"
    attrs:
      name: "Sonarr"
      provider: "!Key provider_proxy_sonarr"
      meta_launch_url: "https://sonarr.srv.lan.vyrx.de"
      group: "Media"
      open_in_new_tab: true

