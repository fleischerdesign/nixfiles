version: 1
metadata:
  name: "vyrx-apps-oidc"
entries:
  # 1. Grafana
  - model: authentik_providers_oauth2.oauth2provider
    id: provider_grafana
    identifiers:
      name: "Provider for Grafana"
    attrs:
      client_id: "KYgWM4pQYJh61GCmnGIwXMCJYR26mzRhDpJqnn7k"
      client_secret: "UoKku3EsVJUQaoM6SJpzBWXK8xYAbFL8xX7Hp69dQ5ZDiGSXBphK1s7uEgsQdNm9133viUb3zSR5byY15XGDgCjozf4lnUQUCpqRGmfD54j6Ue0lEIq03MrQefTNtr2x"
      authorization_flow: "!Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]"
      redirect_uris:
        - "https://grafana.ops.vyrx.de/login/generic_oauth"
        - "https://mon.lan.vyrx.de/login/generic_oauth"
      sub_mode: "hashed_user_id"
      include_claims_in_id_token: true

  - model: authentik_core.application
    identifiers:
      slug: "grafana"
    attrs:
      name: "Grafana"
      provider: "!Key provider_grafana"
      meta_launch_url: "https://grafana.ops.vyrx.de"
      group: "Observability"
      open_in_new_tab: true

