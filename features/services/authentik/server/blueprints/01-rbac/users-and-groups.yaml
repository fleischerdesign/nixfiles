version: 1
metadata:
  name: "vyrx-rbac-groups-and-users"
  labels:
    vyrx: "owned"
entries:
  # Groups
  - model: authentik_core.group
    id: group_infra_admins
    identifiers:
      name: "infra-admins"
    attrs:
      is_superuser: true
      attributes:
        description: "Cluster Administrators (Root & Global Access)"

  - model: authentik_core.group
    id: group_media_users
    identifiers:
      name: "media-users"
    attrs:
      is_superuser: false
      attributes:
        description: "Access to Media Streaming & Requests"

  - model: authentik_core.group
    id: group_family
    identifiers:
      name: "family"
    attrs:
      is_superuser: false
      attributes:
        description: "Family members with home automation & smart home access"

  # Users: Philipp (Admin), Katja, Lilly, Kai, Rieke.
  #
  # The object is seeded; the membership is not. `groups` is deliberately absent: who is in which
  # group is the access decision and belongs to the interface (docs/identity.md §11.1). Declaring it
  # here would overwrite a human's change at the next apply, and access runs only through membership
  # (no per-user application bindings either).
  - model: authentik_core.user
    id: user_philipp
    identifiers:
      username: "philipp"
    attrs:
      name: "Philipp"
      email: "philipp@vyrx.de"

  - model: authentik_core.user
    id: user_katja
    identifiers:
      username: "katja"
    attrs:
      name: "Katja"
      email: "katja@vyrx.de"

  - model: authentik_core.user
    id: user_lilly
    identifiers:
      username: "lilly"
    attrs:
      name: "Lilly"
      email: "lilly@vyrx.de"

  - model: authentik_core.user
    id: user_kai
    identifiers:
      username: "kai"
    attrs:
      name: "Kai"
      email: "kai@vyrx.de"

  - model: authentik_core.user
    id: user_rieke
    identifiers:
      username: "rieke"
    attrs:
      name: "Rieke"
      email: "rieke@vyrx.de"
