# features/services/klipper/printer-config/macros.cfg
# Declarative G-Code Macros for 3D Printing Workflow (PROVISIONING.md 4).

[gcode_macro START_PRINT]
description: Pre-heat, home axes, and purge nozzle
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    # 1. Start bed heating
    M140 S{BED_TEMP}
    # 2. Home all axes
    G28
    # 3. Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # 4. Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP}
    # 5. Absolute positioning & reset extruder
    G90
    G92 E0
    # 6. Prime line
    G1 Z2.0 F3000
    G1 X0.1 Y20 Z0.3 F5000.0
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15
    G1 X0.4 Y200.0 Z0.3 F5000.0
    G1 X0.4 Y20 Z0.3 F1500.0 E30
    G92 E0
    G1 Z2.0 F3000

[gcode_macro END_PRINT]
description: Retract, present print, and turn off heaters
gcode:
    # Retract filament
    G91
    G1 E-2 F2700
    G1 E-1.5 Z0.2 F2400
    G1 X5 Y5 F3000
    G1 Z10
    G90
    # Present print
    G1 X0 Y220 F3000
    # Turn off heaters and fan
    M104 S0
    M140 S0
    M106 S0
    # Disable steppers
    M84

[gcode_macro CANCEL_PRINT]
description: Cancel the current running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    G91
    G1 Z10 E-2 F3000
    G90
    G1 X0 Y220 F3000
    M84
    CANCEL_PRINT_BASE
